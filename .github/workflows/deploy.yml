# Автоматическая сборка и публикация сайта на GitHub Pages.
# Запускается при каждом изменении в ветке main (и вручную из вкладки Actions).
name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Настроить GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # Готовые уменьшенные фото сохраняются между запусками,
      # чтобы не пересчитывать их каждый раз (это самая долгая часть).
      - name: Кэш обработанных фото
        uses: actions/cache@v4
        with:
          path: .cache/img
          key: img-${{ hashFiles('materials/**', 'scripts/build-images.mjs') }}
          restore-keys: img-

      - run: npm ci

      - name: Собрать сайт
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
